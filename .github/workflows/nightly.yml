name: Nightly Cross-Platform CI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build & Diagnostic Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Test Suite
        run: cargo test --manifest-path cli/Cargo.toml
      - name: Build Binary
        run: cargo build --manifest-path cli/Cargo.toml
      - name: Run E2E CLI Diagnostics
        run: |
          cargo run --manifest-path cli/Cargo.toml -- doctor --json
          cargo run --manifest-path cli/Cargo.toml -- completions zsh
