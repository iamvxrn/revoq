[package]
name = "revoq"
version = "0.8.0"
edition = "2021"
authors = ["revoq contributors", "Claude"]
description = """A modern package manager and build system for C and C++, with strict
project-layout enforcement and deep Clang integration."""
license = "MIT"
repository = "https://github.com/xntas/revoq"

[[bin]]
name = "revoq"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"